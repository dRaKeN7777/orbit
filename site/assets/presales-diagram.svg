<rect x="56" y="150" width="488" height="372" rx="10" fill="#ffffff" stroke="#dcd7c8" stroke-width="1.5"/>
<line x1="56" y1="196" x2="544" y2="196" stroke="#eee9e0" stroke-width="1.5"/>
<circle cx="82" cy="173" r="5" fill="#a8402c"/>
<text x="98" y="178" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#a8402c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WHERE IT BREAKS</text>
<text x="82" y="228" font-size="13" font-weight="700" fill="#a8402c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
<text x="118" y="228" font-size="14.5" font-weight="400" fill="#26303d" font-family="sans">Deal state lives in one person’s inbox and head</text>
<text x="82" y="332" font-size="13" font-weight="700" fill="#a8402c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
<text x="118" y="332" font-size="14.5" font-weight="400" fill="#26303d" font-family="sans">Three people give three different answers about live</text>
<text x="118" y="352" font-size="14.5" font-weight="400" fill="#26303d" font-family="sans">bids</text>
<text x="82" y="436" font-size="13" font-weight="700" fill="#a8402c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
<text x="118" y="436" font-size="14.5" font-weight="400" fill="#26303d" font-family="sans">Handover to delivery reconstructs what was promised</text>

<line x1="566" y1="336" x2="634" y2="336" stroke="#8a9a90" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="656" y="150" width="488" height="372" rx="10" fill="#ffffff" stroke="#dcd7c8" stroke-width="1.5"/>
<line x1="656" y1="196" x2="1144" y2="196" stroke="#eee9e0" stroke-width="1.5"/>
<circle cx="682" cy="173" r="5" fill="#004530"/>
<text x="698" y="178" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#004530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">WHAT HAS TO CHANGE</text>
<text x="682" y="228" font-size="13" font-weight="700" fill="#004530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
<text x="718" y="228" font-size="14.5" font-weight="400" fill="#26303d" font-family="sans">One record per deal from first call to renewal</text>
<text x="682" y="332" font-size="13" font-weight="700" fill="#004530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
<text x="718" y="332" font-size="14.5" font-weight="400" fill="#26303d" font-family="sans">Stage and owner visible without asking anyone</text>
<text x="682" y="436" font-size="13" font-weight="700" fill="#004530" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03</text>
<text x="718" y="436" font-size="14.5" font-weight="400" fill="#26303d" font-family="sans">Delivery receives the assumptions, not a summary of</text>
<text x="718" y="456" font-size="14.5" font-weight="400" fill="#26303d" font-family="sans">them</text>

